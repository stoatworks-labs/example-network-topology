<svg viewBox="0 0 1300 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1300" height="560" fill="#ffffff"/>
  <text x="650" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">File Sync Flow</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2a6f97"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#5a8f3c"/>
    </marker>
  </defs>

  <!-- Theatre laptops (x4 roles, x12 theatres) -->
  <rect x="40" y="90" width="280" height="150" rx="8" fill="#2a6f97" stroke="#1c4d69"/>
  <text x="180" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Theatre laptops (×12 theatres)</text>
  <line x1="60" y1="130" x2="300" y2="130" stroke="#e0eefc"/>
  <text x="180" y="152" text-anchor="middle" font-size="12" fill="#e0eefc">PowerPoint Main / Backup</text>
  <text x="180" y="172" text-anchor="middle" font-size="12" fill="#e0eefc">VT Main / Backup</text>
  <text x="180" y="198" text-anchor="middle" font-size="11" fill="#bcd8f0">each runs rclone</text>
  <text x="180" y="216" text-anchor="middle" font-size="10" fill="#bcd8f0">192.168.{2-13}.5/.6/.7/.8 — 48 laptops total</text>

  <!-- Ready room PCs -->
  <rect x="40" y="330" width="280" height="120" rx="8" fill="#5a8f3c" stroke="#3d6528"/>
  <text x="180" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Ready Room PCs</text>
  <text x="180" y="382" text-anchor="middle" font-size="12" fill="#e2f0d9">4× — 192.168.1.30–.33</text>
  <text x="180" y="404" text-anchor="middle" font-size="11" fill="#cde8c0">live local WebDAV mount</text>
  <text x="180" y="422" text-anchor="middle" font-size="11" fill="#cde8c0">(no rclone — same LAN)</text>

  <!-- Nextcloud -->
  <rect x="880" y="200" width="280" height="160" rx="8" fill="#1a1a2e" stroke="#0d0d17"/>
  <text x="1020" y="232" text-anchor="middle" font-size="15" font-weight="bold" fill="#fff">Nextcloud</text>
  <text x="1020" y="252" text-anchor="middle" font-size="12" fill="#cfd3e6">mothership — 192.168.1.13</text>
  <line x1="900" y1="266" x2="1140" y2="266" stroke="#3a3a5a"/>
  <text x="1020" y="290" text-anchor="middle" font-size="12" fill="#cfd3e6">/$TheatreName/ per theatre</text>
  <text x="1020" y="312" text-anchor="middle" font-size="11" fill="#9aa0c0">(rclone targets, one folder each)</text>
  <text x="1020" y="336" text-anchor="middle" font-size="11" fill="#9aa0c0">+ ready room WebDAV root</text>

  <!-- Arrows -->
  <path d="M320,165 L880,255" fill="none" stroke="#2a6f97" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <text x="560" y="185" font-size="12" fill="#2a6f97" font-weight="bold">rclone sync (over Tailscale, WAN)</text>

  <path d="M320,390 L880,320" fill="none" stroke="#5a8f3c" stroke-width="2.5" marker-end="url(#arrow3)"/>
  <text x="560" y="400" font-size="12" fill="#5a8f3c" font-weight="bold">WebDAV mount (local LAN, no rclone)</text>

  <text x="650" y="520" text-anchor="middle" font-size="11" fill="#888">Theatre laptops sync up over the tailnet via rclone; ready room PCs write straight to Nextcloud over a local WebDAV mount since they share the mothership LAN.</text>
</svg>
