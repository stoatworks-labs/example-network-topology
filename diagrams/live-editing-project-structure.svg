<title>Live Editing — Project Structure &amp; Smart-Bin Workflow</title>
<defs><marker id="m1e2235" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e2235"/></marker><marker id="m3b7a37" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3b7a37"/></marker><marker id="m64458f" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64458f"/></marker><marker id="m946200" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#946200"/></marker></defs>
<rect width="1400" height="680" fill="#ffffff"/>
<text x="700.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1d2b">Live Editing — Project Structure &amp; Smart-Bin Workflow</text>
<text x="700.0" y="58" text-anchor="middle" font-size="13" fill="#5b6170">resolve-configurator builds the project ahead of time, so the editor&#x27;s job is only cutting</text>
<rect x="20.0" y="80.0" width="1360.0" height="250.0" rx="10" fill="#fbf4e2" stroke="#d5d9e2" stroke-width="1.5"/>
<text x="36.0" y="104.0" font-size="12" fill="#946200" font-weight="bold">BEFORE THE EVENT — once</text>
<rect x="20.0" y="350.0" width="1360.0" height="230.0" rx="10" fill="#f2eef8" stroke="#d5d9e2" stroke-width="1.5"/>
<text x="36.0" y="374.0" font-size="12" fill="#64458f" font-weight="bold">DURING THE EVENT — per session, automatic</text>
<g><rect x="40" y="130" width="250" height="150" rx="8" fill="#eceef4" stroke="#1e2235" stroke-width="1.5"/><path d="M40,162 V138 a8,8 0 0 1 8,-8 H282 a8,8 0 0 1 8,8 V162 Z" fill="#1e2235"/></g>
<text x="165.0" y="151.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Session CSV</text>
<text x="165.0" y="188.0" font-size="12" fill="#1a1d2b" text-anchor="middle">theatre, date, start time,</text>
<text x="165.0" y="207.0" font-size="12" fill="#1a1d2b" text-anchor="middle">presenter</text>
<text x="165.0" y="226.0" font-size="12" fill="#5b6170" text-anchor="middle"></text>
<text x="165.0" y="245.0" font-size="12" fill="#5b6170" text-anchor="middle">same CSV nc-filedropbatch</text>
<text x="165.0" y="264.0" font-size="12" fill="#5b6170" text-anchor="middle">uses for presenter uploads</text>
<g><rect x="350" y="120" width="300" height="180" rx="8" fill="#fbf4e2" stroke="#946200" stroke-width="1.5"/><path d="M350,166 V128 a8,8 0 0 1 8,-8 H642 a8,8 0 0 1 8,8 V166 Z" fill="#946200"/></g>
<text x="500.0" y="141.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">resolve-configurator</text>
<text x="500.0" y="158.0" font-size="11.5" fill="#e6e9f0" text-anchor="middle">Python, stdlib only · idempotent</text>
<text x="500.0" y="192.0" font-size="12" fill="#1a1d2b" text-anchor="middle">dry-run needs no Resolve install;</text>
<text x="500.0" y="211.0" font-size="12" fill="#1a1d2b" text-anchor="middle">applying needs Resolve Studio</text>
<text x="500.0" y="230.0" font-size="12" fill="#1a1d2b" text-anchor="middle"></text>
<text x="500.0" y="249.0" font-size="12" fill="#1a1d2b" text-anchor="middle">builds everything the scripting</text>
<text x="500.0" y="268.0" font-size="12" fill="#1a1d2b" text-anchor="middle">API can create</text>
<g><rect x="710" y="120" width="320" height="180" rx="8" fill="#eceef4" stroke="#1e2235" stroke-width="1.5"/><path d="M710,166 V128 a8,8 0 0 1 8,-8 H1022 a8,8 0 0 1 8,8 V166 Z" fill="#1e2235"/></g>
<text x="870.0" y="141.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Shell Resolve project</text>
<text x="870.0" y="158.0" font-size="11.5" fill="#e6e9f0" text-anchor="middle">on the Mac mini&#x27;s Project Server</text>
<text x="870.0" y="192.0" font-size="12" fill="#1a1d2b" text-anchor="middle">bin per theatre / day</text>
<text x="870.0" y="211.0" font-size="12" fill="#1a1d2b" text-anchor="middle">empty timeline per session</text>
<text x="870.0" y="230.0" font-size="12" fill="#1a1d2b" text-anchor="middle">(&quot;Start Time - Presenter&quot;)</text>
<text x="870.0" y="249.0" font-size="12" fill="#1a1d2b" text-anchor="middle">backgrounds + title slides imported</text>
<text x="870.0" y="268.0" font-size="12" fill="#1a1d2b" text-anchor="middle">project format settings applied</text>
<g><rect x="1090" y="120" width="270" height="180" rx="8" fill="#fbf4e2" stroke="#946200" stroke-width="1.5"/><path d="M1090,166 V128 a8,8 0 0 1 8,-8 H1352 a8,8 0 0 1 8,8 V166 Z" fill="#946200"/></g>
<text x="1225.0" y="141.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Smart-bin recipe</text>
<text x="1225.0" y="158.0" font-size="11.5" fill="#e6e9f0" text-anchor="middle">smart-bins.md / .json</text>
<text x="1225.0" y="192.0" font-size="12" fill="#1a1d2b" text-anchor="middle">per session: file path, date</text>
<text x="1225.0" y="211.0" font-size="12" fill="#1a1d2b" text-anchor="middle">created, start TC in the</text>
<text x="1225.0" y="230.0" font-size="12" fill="#1a1d2b" text-anchor="middle">session window (path rule must</text>
<text x="1225.0" y="249.0" font-size="12" fill="#5b6170" text-anchor="middle">match the NAS layout — open item)</text>
<text x="1225.0" y="268.0" font-size="12" fill="#5b6170" text-anchor="middle">the API can&#x27;t create smart bins:</text>
<text x="1225.0" y="287.0" font-size="12" fill="#5b6170" text-anchor="middle">applied by hand, once</text>
<path d="M290.0,205.0 L350.0,205.0" fill="none" stroke="#1e2235" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#m1e2235)"/>
<path d="M650.0,190.0 L710.0,190.0" fill="none" stroke="#1e2235" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#m1e2235)"/>
<rect x="655.9" y="166.0" width="48.3" height="17.0" rx="4" fill="#ffffff"/>
<text x="680.0" y="177.0" font-size="11" fill="#1e2235" text-anchor="middle" font-weight="bold">builds</text>
<path d="M650.0,260.0 L680.0,260.0 L680.0,318.0 L1225.0,318.0 L1225.0,300.0" fill="none" stroke="#946200" stroke-width="2.2" stroke-linejoin="round" stroke-dasharray="8 5" marker-end="url(#m946200)"/>
<rect x="909.9" y="312.0" width="80.2" height="17.0" rx="4" fill="#ffffff"/>
<text x="950.0" y="323.0" font-size="11" fill="#946200" text-anchor="middle" font-weight="bold">also writes</text>
<g><rect x="980" y="400" width="380" height="150" rx="8" fill="#f2eef8" stroke="#64458f" stroke-width="1.5"/><path d="M980,446 V408 a8,8 0 0 1 8,-8 H1352 a8,8 0 0 1 8,8 V446 Z" fill="#64458f"/></g>
<text x="1170.0" y="421.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Footage lands on the NAS</text>
<text x="1170.0" y="438.0" font-size="11.5" fill="#e6e9f0" text-anchor="middle">dual-write from the ingest pull</text>
<text x="1170.0" y="474.0" font-size="12" fill="#1a1d2b" text-anchor="middle">files grow through the session</text>
<text x="1170.0" y="494.0" font-size="12" fill="#5b6170" text-anchor="middle">(see the data-flow diagram)</text>
<g><rect x="520" y="400" width="380" height="150" rx="8" fill="#edf6eb" stroke="#3b7a37" stroke-width="1.5"/><path d="M520,446 V408 a8,8 0 0 1 8,-8 H892 a8,8 0 0 1 8,8 V446 Z" fill="#3b7a37"/></g>
<text x="710.0" y="421.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Smart bins auto-fill</text>
<text x="710.0" y="438.0" font-size="11.5" fill="#e6e9f0" text-anchor="middle">filter rule from the recipe</text>
<text x="710.0" y="474.0" font-size="12" fill="#1a1d2b" text-anchor="middle">only that session&#x27;s clips appear —</text>
<text x="710.0" y="494.0" font-size="12" fill="#1a1d2b" text-anchor="middle">no manual sorting, no scrubbing</text>
<g><rect x="40" y="400" width="400" height="150" rx="8" fill="#f2eef8" stroke="#64458f" stroke-width="1.5"/><path d="M40,432 V408 a8,8 0 0 1 8,-8 H432 a8,8 0 0 1 8,8 V432 Z" fill="#64458f"/></g>
<text x="240.0" y="421.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Editor&#x27;s job</text>
<text x="64.0" y="458.0" font-size="12.5" fill="#1a1d2b">1. open the session&#x27;s timeline</text>
<text x="64.0" y="480.0" font-size="12.5" fill="#1a1d2b">2. drag clips from its smart bin</text>
<text x="64.0" y="502.0" font-size="12.5" fill="#1a1d2b">3. top-and-tail</text>
<text x="64.0" y="524.0" font-size="12.5" fill="#1a1d2b">4. export (optionally via Remote Render)</text>
