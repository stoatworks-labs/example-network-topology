<text x="820.0" y="279.0" font-size="11" fill="#64458f" text-anchor="middle" font-weight="bold">write 2 (Unraid&#x27;s 10GbE edit-LAN port)</text>
<path d="M1175.0,240.0 L1175.0,300.0" fill="none" stroke="#64458f" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#m64458f)" marker-start="url(#m64458fs)"/>
