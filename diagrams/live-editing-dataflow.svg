<text x="185.0" y="141.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">ATEM Mini Extreme ISO ×12</text>
<text x="185.0" y="158.0" font-size="11.5" fill="#e6e9f0" text-anchor="middle">192.168.X.2 · FTP (G2: network share)</text>
<text x="185.0" y="190.0" font-size="12" fill="#1a1d2b" text-anchor="middle">pulled live: program + input 1</text>
<text x="185.0" y="208.0" font-size="11.5" fill="#5b6170" text-anchor="middle">(camera; + 2/3 laptops if headroom)</text>
<text x="185.0" y="226.0" font-size="11.5" fill="#5b6170" text-anchor="middle">every input stays on its SSD</text>
<g><rect x="40" y="280" width="290" height="120" rx="8" fill="#fbedef" stroke="#b03a48" stroke-width="1.5"/><path d="M40,326 V288 a8,8 0 0 1 8,-8 H322 a8,8 0 0 1 8,8 V326 Z" fill="#b03a48"/></g>
<text x="185.0" y="301.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">VMix PCs ×4</text>
<text x="185.0" y="318.0" font-size="11.5" fill="#e6e9f0" text-anchor="middle">192.168.20/21.21–.22 · SMB share</text>
<text x="185.0" y="352.0" font-size="12" fill="#1a1d2b" text-anchor="middle">recordings on local disk</text>
<text x="185.0" y="371.0" font-size="12" fill="#5b6170" text-anchor="middle">(the master copy)</text>
<g><rect x="410" y="190" width="260" height="140" rx="8" fill="#eef0f5" stroke="#3d4a63" stroke-width="1.5"/><path d="M410,236 V198 a8,8 0 0 1 8,-8 H662 a8,8 0 0 1 8,8 V236 Z" fill="#3d4a63"/></g>
<text x="540.0" y="211.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Ingest containers</text>
<text x="540.0" y="228.0" font-size="11.5" fill="#e6e9f0" text-anchor="middle">Unraid</text>
<text x="540.0" y="260.0" font-size="12.5" fill="#1a1d2b" text-anchor="middle">ATEM ISO Ingest — .1.17</text>
<text x="540.0" y="279.0" font-size="12.5" fill="#1a1d2b" text-anchor="middle">VMix Record Ingest — .1.18</text>
<text x="540.0" y="302.0" font-size="11.5" fill="#5b6170" text-anchor="middle" font-style="italic">incremental copy of growing files</text>
<g><rect x="720" y="130" width="200" height="110" rx="8" fill="#eceef4" stroke="#1e2235" stroke-width="1.5"/><path d="M720,176 V138 a8,8 0 0 1 8,-8 H912 a8,8 0 0 1 8,8 V176 Z" fill="#1e2235"/></g>
