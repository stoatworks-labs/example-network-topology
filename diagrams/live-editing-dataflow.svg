<rect width="1400" height="615" fill="#ffffff"/>
<text x="700.0" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1d2b">Live Editing — Data Flow</text>
<text x="700.0" y="58" text-anchor="middle" font-size="13" fill="#5b6170">One pull off each ATEM/VMix source, written twice — never a chained re-sync</text>
<rect x="20.0" y="80.0" width="330.0" height="360.0" rx="10" fill="#eaf2f8" stroke="#d5d9e2" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="185.0" y="102.0" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="bold">Theatres + VMix nodes (via tailnet)</text>
