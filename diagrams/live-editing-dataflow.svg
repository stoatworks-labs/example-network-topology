<text x="1175.0" y="275.0" font-size="11" fill="#64458f" text-anchor="middle" font-weight="bold">10GbE</text>
<g><rect x="1000" y="500" width="350" height="80" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/><path d="M1000,532 V508 a8,8 0 0 1 8,-8 H1342 a8,8 0 0 1 8,8 V532 Z" fill="#6b7280"/></g>
<text x="1175.0" y="521.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Physical media (DIT offload)</text>
<text x="1175.0" y="556.0" font-size="12" fill="#1a1d2b" text-anchor="middle">ATEM SSDs (all ISOs not pulled live) walked to</text>
<text x="1175.0" y="574.0" font-size="12" fill="#1a1d2b" text-anchor="middle">the edit suite · checksummed copy to the NAS</text>
<path d="M1350.0,540.0 L1368.0,540.0 L1368.0,200.0 L1350.0,200.0" fill="none" stroke="#6b7280" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#m6b7280)"/>
<text x="480.0" y="480.0" font-size="12.5" fill="#1a1d2b" text-anchor="middle" font-weight="bold">Why two writes, not Nextcloud → NAS:</text>
<text x="480.0" y="502.0" font-size="12" fill="#5b6170" text-anchor="middle">the edit suite never waits on Nextcloud&#x27;s own files:scan,</text>
<text x="480.0" y="521.0" font-size="12" fill="#5b6170" text-anchor="middle">and editors never read from the pool ingest is writing to.</text>
<text x="480.0" y="540.0" font-size="12" fill="#5b6170" text-anchor="middle">ISOs run ~35–70 Mb/s each and can&#x27;t be turned down,</text>
<text x="480.0" y="559.0" font-size="12" fill="#5b6170" text-anchor="middle">so only program + camera go live; the second write</text>
<text x="480.0" y="578.0" font-size="12" fill="#5b6170" text-anchor="middle">is not yet implemented in the ingest scripts.</text>
</svg>
