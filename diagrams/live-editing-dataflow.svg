<text x="1016.0" y="414.0" font-size="12.5" fill="#1a1d2b">Mac mini — Project Server</text>
<text x="1334.0" y="414.0" font-size="12.5" fill="#1a1d2b" text-anchor="end" font-weight="bold">.22.20</text>
<text x="1016.0" y="435.0" font-size="12.5" fill="#1a1d2b">   + Resolve Remote Render</text>
<text x="1334.0" y="435.0" font-size="12.5" fill="#1a1d2b" text-anchor="end" font-weight="bold"></text>
<text x="1175.0" y="462.0" font-size="11.5" fill="#5b6170" text-anchor="middle" font-style="italic">shared Resolve project (resolve-configurator)</text>
