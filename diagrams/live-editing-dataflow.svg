<text x="660.0" y="102.0" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="bold">Mothership LAN — 192.168.1.0/24</text>
<rect x="970.0" y="80.0" width="410.0" height="520.0" rx="10" fill="#f2eef8" stroke="#d5d9e2" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1175.0" y="102.0" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="bold">Edit suite LAN — 192.168.22.0/24, 10GbE</text>
