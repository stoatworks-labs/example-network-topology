<text x="1175.0" y="151.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Edit Suite NAS</text>
<text x="1175.0" y="168.0" font-size="11.5" fill="#e6e9f0" text-anchor="middle">192.168.22.2 · 10GbE</text>
<text x="1175.0" y="202.0" font-size="12.5" fill="#1a1d2b" text-anchor="middle">editing copy, same pull</text>
