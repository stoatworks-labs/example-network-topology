<text x="1175.0" y="321.0" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Edit suite machines</text>
<text x="1175.0" y="338.0" font-size="11.5" fill="#e6e9f0" text-anchor="middle">MacBooks via Thunderbolt adapters · Mac mini 10GbE option</text>
<text x="1016.0" y="372.0" font-size="12.5" fill="#1a1d2b">MacBook Pro — Editor 1</text>
<text x="1334.0" y="372.0" font-size="12.5" fill="#1a1d2b" text-anchor="end" font-weight="bold">.22.11</text>
